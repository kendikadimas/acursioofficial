<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-3%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="460" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />

  <!-- QRIS Header Area -->
  <g transform="translate(200, 48)" text-anchor="middle">
    <!-- QRIS Red & Dark Gray Logo Typography -->
    <text x="-4" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="1">
      <tspan fill="#C53030">Q</tspan><tspan fill="#1A202C">RIS</tspan>
    </text>
    <text x="0" y="15" fill="#718096" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">
      STANDAR PEMBAYARAN NASIONAL
    </text>
  </g>

  <!-- Divider -->
  <line x1="30" y1="74" x2="370" y2="74" stroke="#EDF2F7" stroke-width="1.5" />

  <!-- Store Info -->
  <g transform="translate(200, 96)" text-anchor="middle">
    <text x="0" y="0" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">
      ACURSIO OFFICIAL STORE
    </text>
    <text x="0" y="16" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">
      MERCHANT RESMI TERVERIFIKASI
    </text>
  </g>

  <!-- QR Code Matrix Container (240x240) -->
  <g transform="translate(80, 128)">
    <!-- QR Frame -->
    <rect width="240" height="240" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" rx="4" />

    <!-- Top-Left Finder Pattern -->
    <rect x="12" y="12" width="56" height="56" rx="6" fill="#0F172A" />
    <rect x="20" y="20" width="40" height="40" rx="3" fill="#FFFFFF" />
    <rect x="28" y="28" width="24" height="24" rx="2" fill="#0F172A" />

    <!-- Top-Right Finder Pattern -->
    <rect x="172" y="12" width="56" height="56" rx="6" fill="#0F172A" />
    <rect x="180" y="20" width="40" height="40" rx="3" fill="#FFFFFF" />
    <rect x="188" y="28" width="24" height="24" rx="2" fill="#0F172A" />

    <!-- Bottom-Left Finder Pattern -->
    <rect x="12" y="172" width="56" height="56" rx="6" fill="#0F172A" />
    <rect x="20" y="180" width="40" height="40" rx="3" fill="#FFFFFF" />
    <rect x="28" y="188" width="24" height="24" rx="2" fill="#0F172A" />

    <!-- Timing Patterns -->
    <g fill="#0F172A">
      <rect x="76" y="36" width="8" height="8" />
      <rect x="92" y="36" width="8" height="8" />
      <rect x="108" y="36" width="8" height="8" />
      <rect x="124" y="36" width="8" height="8" />
      <rect x="140" y="36" width="8" height="8" />
      <rect x="156" y="36" width="8" height="8" />

      <rect x="36" y="76" width="8" height="8" />
      <rect x="36" y="92" width="8" height="8" />
      <rect x="36" y="108" width="8" height="8" />
      <rect x="36" y="124" width="8" height="8" />
      <rect x="36" y="140" width="8" height="8" />
      <rect x="36" y="156" width="8" height="8" />
    </g>

    <!-- Small Alignment Pattern (Bottom-Right) -->
    <rect x="168" y="168" width="36" height="36" rx="4" fill="#0F172A" />
    <rect x="176" y="176" width="20" height="20" rx="2" fill="#FFFFFF" />
    <rect x="182" y="182" width="8" height="8" fill="#0F172A" />

    <!-- Data Modules (Clean QR Matrix) -->
    <g fill="#0F172A">
      <!-- Zone 1: Center-left & middle -->
      <rect x="76" y="76" width="16" height="8" />
      <rect x="100" y="76" width="8" height="16" />
      <rect x="116" y="76" width="24" height="8" />
      <rect x="148" y="76" width="8" height="16" />
      <rect x="76" y="92" width="8" height="16" />
      <rect x="92" y="100" width="16" height="8" />
      <rect x="116" y="92" width="8" height="8" />
      <rect x="132" y="100" width="16" height="16" />
      
      <!-- Zone 2: Middle horizontal band -->
      <rect x="76" y="116" width="24" height="8" />
      <rect x="108" y="116" width="8" height="16" />
      <rect x="124" y="116" width="16" height="8" />
      <rect x="148" y="116" width="16" height="8" />
      
      <!-- Zone 3: Middle lower band -->
      <rect x="84" y="132" width="8" height="16" />
      <rect x="100" y="140" width="16" height="8" />
      <rect x="124" y="132" width="8" height="24" />
      <rect x="140" y="140" width="16" height="8" />
      <rect x="164" y="132" width="8" height="16" />

      <!-- Zone 4: Right band below finder -->
      <rect x="172" y="76" width="16" height="8" />
      <rect x="196" y="76" width="16" height="8" />
      <rect x="216" y="76" width="8" height="16" />
      <rect x="180" y="92" width="8" height="24" />
      <rect x="204" y="92" width="16" height="8" />
      <rect x="196" y="108" width="8" height="16" />
      <rect x="212" y="116" width="12" height="8" />

      <!-- Zone 5: Bottom right surrounding alignment -->
      <rect x="76" y="164" width="16" height="8" />
      <rect x="100" y="164" width="8" height="16" />
      <rect x="116" y="164" width="16" height="8" />
      <rect x="140" y="164" width="16" height="8" />
      <rect x="76" y="180" width="8" height="24" />
      <rect x="92" y="188" width="16" height="8" />
      <rect x="116" y="180" width="8" height="16" />
      <rect x="132" y="188" width="24" height="8" />
      <rect x="92" y="212" width="24" height="8" />
      <rect x="124" y="204" width="8" height="16" />
      <rect x="140" y="212" width="16" height="8" />
      
      <rect x="212" y="140" width="12" height="24" />
      <rect x="212" y="172" width="12" height="16" />
      <rect x="212" y="196" width="12" height="24" />
      <rect x="168" y="212" width="36" height="8" />
    </g>

    <!-- Central QRIS GPN Emblem -->
    <rect x="102" y="102" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <rect x="106" y="106" width="28" height="28" rx="4" fill="#C53030" />
    <text x="120" y="124" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">
      GPN
    </text>
  </g>

  <!-- Instructions Footer in Card -->
  <g transform="translate(200, 396)" text-anchor="middle">
    <rect x="-160" y="-12" width="320" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="0" y="6" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">
      Scan dengan BCA, Mandiri, BRI, GoPay, DANA, OVO
    </text>
  </g>

  <!-- Security Verification Footer -->
  <g transform="translate(200, 442)" text-anchor="middle">
    <text x="0" y="0" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">
      DICETAK OTOMATIS OLEH ACURSIO OFFICIAL GATEWAY
    </text>
  </g>
</svg>
