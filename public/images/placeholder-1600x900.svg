<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGradient)" />
  <rect width="1600" height="900" fill="url(#grid)" />

  <!-- Center Framing -->
  <rect x="60" y="60" width="1480" height="780" rx="24" fill="none" stroke="url(#borderGradient)" stroke-width="2" />
  
  <!-- Image Icon Graphic -->
  <g transform="translate(800, 410)" text-anchor="middle">
    <rect x="-60" y="-80" width="120" height="90" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />
    <circle cx="-25" cy="-45" r="12" fill="#38bdf8" opacity="0.8" />
    <path d="M -50 -5 L -20 -35 L 10 -5 L 30 -25 L 50 -5 Z" fill="#2563eb" opacity="0.8" />
    
    <!-- Resolution Badge -->
    <rect x="-140" y="40" width="280" height="46" rx="23" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="0" y="70" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="3">1600 × 900</text>
    
    <text x="0" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" letter-spacing="2">PLACEHOLDER BANNER PROMO</text>
  </g>
</svg>
