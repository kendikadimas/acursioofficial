<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="prodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1422" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    <linearGradient id="prodBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="prodGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#prodBg)" />
  <rect width="800" height="600" fill="url(#prodGrid)" />

  <!-- Inner Frame -->
  <rect x="25" y="25" width="750" height="550" rx="16" fill="none" stroke="url(#prodBorder)" stroke-width="1.5" />

  <!-- Icon & Resolution Label -->
  <g transform="translate(400, 275)" text-anchor="middle">
    <!-- Camera / Screenshot Icon -->
    <rect x="-45" y="-60" width="90" height="65" rx="8" fill="#131c2e" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="-18" cy="-35" r="8" fill="#38bdf8" opacity="0.7" />
    <path d="M -38 -5 L -15 -28 L 8 -5 L 22 -18 L 38 -5 Z" fill="#2563eb" opacity="0.7" />

    <!-- Resolution Pill -->
    <rect x="-110" y="30" width="220" height="36" rx="18" fill="#172235" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="54" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="2">800 × 600</text>
    
    <text x="0" y="90" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SCREENSHOT AKUN GAME</text>
  </g>
</svg>
